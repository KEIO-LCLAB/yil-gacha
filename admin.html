<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YIL ガチャ管理</title><link rel="stylesheet" href="admin.css"></head><body><main><a href="/">← ガチャに戻る</a><h1>YIL ガチャ管理</h1><p>カードの上限を変更すると、公開中のガチャに反映されます。</p><p>管理者専用の簡易ロックです。ログイン情報は共有しないでください。</p><form id="login"><label>ID<input id="login-id" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button">ログイン</button></form><section id="panel" hidden><div class="row"><strong id="current">設定を取得中…</strong><button id="logout" type="button">ログアウト</button></div><form id="settings"><label>100%になるカード枚数<select id="max-cards"></select></label><p>選べる上限は2〜11枚。1枚はクリアファイル0%、上限は100%。途中の伸び方はこれまでと同じです。</p><table><thead><tr><th>カード</th><th>クリアファイル</th><th>シール</th></tr></thead><tbody id="preview"></tbody></table><button id="save">この上限で保存</button></form><p>開いている画面には約30秒以内、または抽選前の確認時に反映します。抽選済み・開封待ちの結果は変更されません。</p></section><p id="message" role="status" aria-live="polite"></p></main><script src="shared.js?v=admin-1"></script><script src="admin.js?v=admin-1"></script></body></html>
